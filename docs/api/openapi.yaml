openapi: 3.1.0
info:
  title: GutShoes API
  version: 0.1.0
  description: Kontrak API GutShoes. Semua timestamp menggunakan UTC dan nilai moneter berupa string desimal.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Memeriksa kesiapan proses API
      tags: [System]
      responses:
        '200':
          description: API aktif
          headers:
            X-Request-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
  /admin/auth/login:
    post:
      summary: Login admin menggunakan session cookie
      tags: [Authentication]
      responses:
        '200': { description: Authenticated }
        '422': { description: Invalid credentials }
  /auth/me:
    get:
      summary: Mengambil user session aktif
      tags: [Authentication]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      summary: Logout dan invalidasi session
      tags: [Authentication]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Logged out }
  /profile:
    get:
      summary: Detail profil customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Customer profile }
    put:
      summary: Perbarui profil customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Updated profile }
        '422': { description: Validation failed }
  /addresses:
    get:
      summary: Daftar alamat milik customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address collection }
    post:
      summary: Tambah alamat customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '201': { description: Address created }
  /addresses/{address}:
    parameters:
      - in: path
        name: address
        required: true
        schema: { type: integer }
    get:
      summary: Detail alamat milik customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address detail }
        '403': { description: Forbidden }
    put:
      summary: Perbarui alamat
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address updated }
    delete:
      summary: Hapus alamat
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address soft-deleted }
  /products:
    get:
      summary: Public catalog dengan search, filter, sorting, dan pagination
      tags: [Catalog]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: brand, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: size, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, price_asc, price_desc, name] } }
      responses:
        '200': { description: Paginated published products }
  /products/{slug}:
    get:
      summary: Detail published product
      tags: [Catalog]
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: Product detail }
        '404': { description: Product not found }
  /admin/products:
    get:
      summary: Admin product list
      tags: [Admin Catalog]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Products } }
    post:
      summary: Create product with variants
      tags: [Admin Catalog]
      security: [{ sanctum: [] }]
      responses: { '201': { description: Product created }, '403': { description: Admin required } }
  /admin/products/{product}/publish:
    post:
      summary: Publish product with active variant
      tags: [Admin Catalog]
      security: [{ sanctum: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
      responses: { '200': { description: Product published }, '422': { description: Missing active variant } }
  /admin/products/{product}/images:
    post:
      summary: Upload validated product image
      tags: [Admin Catalog]
      security: [{ sanctum: [] }]
      responses: { '201': { description: Image stored } }
  /cart:
    get:
      summary: Read or create guest/customer cart
      tags: [Cart]
      responses: { '200': { description: Cart and server pricing } }
  /cart/items:
    post:
      summary: Add product variant to cart
      tags: [Cart]
      responses: { '201': { description: Cart item added } }
  /checkout/quote:
    post:
      summary: Calculate promotion, voucher, shipping, and grand total
      tags: [Checkout]
      responses: { '200': { description: Authoritative quote }, '422': { description: Invalid cart, voucher, or service } }
  /orders:
    post:
      summary: Membuat order dari cart secara idempoten dan mereservasi stok 24 jam
      tags: [Checkout]
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
        - { in: header, name: X-Guest-Cart-Token, required: false, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Order baru dibuat }
        '200': { description: Retry mengembalikan order yang sama }
        '409': { description: Idempotency key digunakan dengan payload berbeda }
        '422': { description: Cart, stok, voucher, alamat, atau shipping tidak valid }
  /orders/{orderNumber}/payment:
    post:
      summary: Membuat atau menggunakan ulang transaksi Midtrans Snap
      tags: [Payment]
      parameters:
        - { in: path, name: orderNumber, required: true, schema: { type: string } }
      responses:
        '201': { description: Snap transaction tersedia }
        '403': { description: Order bukan milik customer }
        '422': { description: Order tidak dapat dibayar }
  /guest/orders/{orderNumber}:
    get:
      summary: Membaca snapshot order guest menggunakan token rahasia
      tags: [Orders]
      parameters:
        - { in: path, name: orderNumber, required: true, schema: { type: string } }
        - { in: header, name: X-Guest-Order-Token, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '200': { description: Status, pembayaran, item, shipping, dan timeline order }
        '404': { description: Order atau token tidak cocok }
        '429': { description: Rate limited }
  /guest/orders/{orderNumber}/payment:
    post:
      summary: Membuat atau menggunakan ulang sesi Midtrans untuk guest order
      tags: [Payment]
      parameters:
        - { in: path, name: orderNumber, required: true, schema: { type: string } }
        - { in: header, name: X-Guest-Order-Token, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '201': { description: Snapshot order dan sesi Midtrans tersedia }
        '404': { description: Order atau token tidak cocok }
        '422': { description: Order sudah tidak dapat dibayar }
        '429': { description: Rate limited }
  /payments/midtrans/webhook:
    post:
      summary: Menerima notifikasi pembayaran Midtrans terverifikasi
      tags: [Payment]
      responses:
        '200': { description: Event diterima atau sudah pernah diproses }
        '401': { description: Signature tidak valid }
  /orders/track:
    post:
      summary: Melacak guest order dengan nomor order dan email
      tags: [Orders]
      responses: { '200': { description: Status dan timeline order }, '404': { description: Kombinasi tidak cocok }, '429': { description: Rate limited } }
  /orders:
    get:
      summary: Riwayat order customer aktif
      tags: [Orders]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Order milik customer }, '401': { description: Unauthenticated } }
  /orders/{orderNumber}:
    get:
      summary: Detail order milik customer aktif
      tags: [Orders]
      security: [{ sanctum: [] }]
      parameters:
        - { in: path, name: orderNumber, required: true, schema: { type: string } }
      responses: { '200': { description: Detail order }, '404': { description: Bukan milik customer } }
  /admin/orders/{order}/fulfillment:
    patch:
      summary: Transisi fulfillment berurutan
      tags: [Admin Orders]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Status diperbarui }, '403': { description: Admin required }, '422': { description: Transisi tidak valid } }
  /orders/{orderNumber}/cancel:
    post:
      summary: Membatalkan order pending payment atau paid
      tags: [Cancellation]
      parameters:
        - { in: path, name: orderNumber, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      responses: { '201': { description: Cancellation approved dan refund pending bila paid }, '422': { description: Status tidak dapat dibatalkan } }
  /admin/refunds/{refund}/process:
    post:
      summary: Memproses atau menggunakan ulang refund Midtrans
      tags: [Admin Refunds]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Status refund terkini }, '403': { description: Admin required } }
  /admin/dashboard:
    get:
      summary: Dashboard operasional, revenue, dan low stock
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Ringkasan operasional }, '403': { description: Admin required } }
  /admin/orders:
    get:
      summary: Daftar order terfilter, tersortir, dan terpaginasikan
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Orders } }
  /admin/audit-logs:
    get:
      summary: Daftar audit log admin yang immutable dan terpaginasikan
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Audit logs }, '403': { description: Admin required } }  /admin/inventories:
    get:
      summary: Daftar inventory lintas warehouse
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Inventories } }
  /admin/inventories/{inventory}/adjust:
    patch:
      summary: Penyesuaian stok tercatat
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Inventory adjusted }, '422': { description: Invariant violation } }
  /admin/configurations/{key}:
    put:
      summary: Menyimpan konfigurasi toko dan low-stock threshold
      tags: [Admin Operations]
      security: [{ sanctum: [] }]
      responses: { '200': { description: Configuration saved } }
  /health/ready:
    get:
      operationId: readinessCheck
      summary: Memeriksa koneksi database dan cache
      tags: [System]
      responses: { '200': { description: Dependency siap }, '503': { description: Dependency degraded } }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: gutshoes_session
  schemas:
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: gutshoes-api }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [message, code, errors, request_id]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: true }
        request_id: { type: [string, 'null'] }
