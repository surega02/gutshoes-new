openapi: 3.1.0
info:
  title: GutShoes API
  version: 0.1.0
  description: Kontrak API GutShoes. Semua timestamp menggunakan UTC dan nilai moneter berupa string desimal.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Memeriksa kesiapan proses API
      tags: [System]
      responses:
        '200':
          description: API aktif
          headers:
            X-Request-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
  /admin/auth/login:
    post:
      summary: Login admin menggunakan session cookie
      tags: [Authentication]
      responses:
        '200': { description: Authenticated }
        '422': { description: Invalid credentials }
  /auth/me:
    get:
      summary: Mengambil user session aktif
      tags: [Authentication]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      summary: Logout dan invalidasi session
      tags: [Authentication]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Logged out }
  /profile:
    get:
      summary: Detail profil customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Customer profile }
    put:
      summary: Perbarui profil customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Updated profile }
        '422': { description: Validation failed }
  /addresses:
    get:
      summary: Daftar alamat milik customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address collection }
    post:
      summary: Tambah alamat customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '201': { description: Address created }
  /addresses/{address}:
    parameters:
      - in: path
        name: address
        required: true
        schema: { type: integer }
    get:
      summary: Detail alamat milik customer
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address detail }
        '403': { description: Forbidden }
    put:
      summary: Perbarui alamat
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address updated }
    delete:
      summary: Hapus alamat
      tags: [Customer]
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Address soft-deleted }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: gutshoes_session
  schemas:
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: gutshoes-api }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [message, code, errors, request_id]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: true }
        request_id: { type: [string, 'null'] }
