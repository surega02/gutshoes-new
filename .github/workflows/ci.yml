name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_sqlite, pdo_mysql, pcntl, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

      - name: Check formatting
        run: composer run format:check

      - name: Run PHPStan
        run: composer run analyse

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build staging bundle
        run: npm run build:staging
        env:
          VITE_API_URL: https://api-ci.invalid/api/v1

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, storefront]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file apps/backend/Dockerfile --tag gutshoes-backend:ci apps/backend

      - name: Build storefront image
        run: docker build --file apps/storefront/Dockerfile --tag gutshoes-storefront:ci --build-arg VITE_API_URL=https://api-ci.invalid/api/v1 apps/storefront
