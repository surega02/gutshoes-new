name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gutshoes_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: "null"
      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: ci@example.test
      MAIL_FROM_NAME: GutShoes CI
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gutshoes_test
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/backend
          composer-options: --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan config:clear --no-interaction

      - name: Validate database migrations
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Run backend tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Check backend formatting
        run: composer format:check

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

  storefront:
    name: Storefront (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint storefront
        run: npm run lint

      - name: Build storefront
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for secrets
        run: bash scripts/check-secrets.sh
